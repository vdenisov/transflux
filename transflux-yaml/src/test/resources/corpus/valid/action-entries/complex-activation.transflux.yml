# The specification's complex-activation operation, its classes swapped for fixtures.
apiVersion: transflux/v1

steps:
  - id: prepare-event-actor
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: validate-prerequisites
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: prepare-notifications
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: send-notifications
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: vip-processing
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: async-notifications
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: refresh-projections
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: emit-audit-record
    class: org.transflux.yaml.LoaderFixtures$RecordingStep
  - id: charge-card
    context: org.transflux.yaml.LoaderFixtures$ChildCtx
    class: org.transflux.yaml.LoaderFixtures$ChildStep
  - id: external-integrations
    context: org.transflux.yaml.LoaderFixtures$ChildCtx
    class: org.transflux.yaml.LoaderFixtures$ChildStep

conditions:
  - id: is-vip-customer
    expression: "priority == 42"

mappers:
  - id: billing-from-activation
    parentType: org.transflux.yaml.LoaderFixtures$Ctx
    childType: org.transflux.yaml.LoaderFixtures$ChildCtx
    class: org.transflux.yaml.LoaderFixtures$ChildMapper
  - id: notification-from-activation
    parentType: org.transflux.yaml.LoaderFixtures$Ctx
    childType: org.transflux.yaml.LoaderFixtures$ChildCtx
    mapTo: "new org.transflux.yaml.LoaderFixtures$ChildCtx()"

listeners:
  - id: lock-failure-audit
    class: org.transflux.yaml.LoaderFixtures$ActionAudit

operations:
  - id: complex-activation
    description: "Complex activation with several actions"
    context: org.transflux.yaml.LoaderFixtures$Ctx

    actions:
      - run: prepare-event-actor
      - run: validate-prerequisites

      - run: charge-card
        mapper: billing-from-activation

      - step: lock-resources
        class: org.transflux.yaml.LoaderFixtures$CtxStep
        description: "Lock resources for activation"
        listeners:
          onError:
            - lock-failure-audit

      - operation: notify-flow
        context: org.transflux.yaml.LoaderFixtures$ChildCtx
        mapper: notification-from-activation
        actions:
          - run: prepare-notifications
          - run: send-notifications

      - choice: priority-routing
        branches:
          - id: high-priority-branch
            condition:
              id: is-high-priority
              predicate: org.transflux.yaml.LoaderFixtures$PriorityPredicate
            actions:
              - step: high-priority-processing
                class: org.transflux.yaml.LoaderFixtures$CtxStep
              - step: urgent-notification
                class: org.transflux.yaml.LoaderFixtures$CtxStep

          - id: medium-priority-branch
            condition:
              expression: "priority >= 5 && priority < 8"
            actions:
              - step: medium-priority-processing
                class: org.transflux.yaml.LoaderFixtures$CtxStep

          - id: vip-customer-branch
            condition: is-vip-customer
            actions:
              - run: vip-processing
              - step: account-manager-notification
                class: org.transflux.yaml.LoaderFixtures$CtxStep

        default:
          actions:
            - step: standard-processing
              class: org.transflux.yaml.LoaderFixtures$CtxStep
            - step: standard-notification
              class: org.transflux.yaml.LoaderFixtures$CtxStep

      - step: finalize
        class: org.transflux.yaml.LoaderFixtures$CtxStep

      - run: async-notifications
        fork: true

      - run: external-integrations
        fork: true
        mapper: notification-from-activation
        onRejection: CALLER_RUNS

      - operation: reconciliation-sweep
        fork: true
        actions:
          - run: refresh-projections
          - run: emit-audit-record

    compensation: org.transflux.yaml.LoaderFixtures$CtxUndo

    errorHandling:
      - exception: java.lang.IllegalStateException
        guard:
          class: org.transflux.yaml.LoaderFixtures$BoomGuard
        compensation: org.transflux.yaml.LoaderFixtures$CtxUndo

      - exception: java.lang.RuntimeException
        guard:
          expression: "message == '503'"
        compensation: org.transflux.yaml.LoaderFixtures$CtxUndo

stateMachine:
  entityType: org.transflux.yaml.LoaderFixtures$Order
  stateResolver:
    expression: 'state'
  stateApplier:
    expression: 'state'
  states:
    - id: a
    - id: b
  transitions:
    - id: t
      from: a
      to: b
      context: org.transflux.yaml.LoaderFixtures$Ctx
      actions:
        - run: complex-activation
