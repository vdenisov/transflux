# One registered manual trigger on two transitions leaving different states.
apiVersion: transflux/v1

triggers:
  - id: cancel
    type: manual

stateMachine:
  entityType: org.transflux.yaml.LoaderFixtures$Order
  stateResolver:
    expression: 'state'
  stateApplier:
    expression: 'state'
  states:
    - id: a
    - id: b
    - id: cancelled
  transitions:
    - id: a-to-cancelled
      from: a
      to: cancelled
      triggers: [cancel]
    - id: b-to-cancelled
      from: b
      to: cancelled
      triggers: [cancel]
